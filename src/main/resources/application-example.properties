# Copie para application-local.properties (ignorado pelo Git) e ajuste.
# NUNCA commite valores reais. Prefira variaveis de ambiente.

# Chave de assinatura do JWT (minimo 32 caracteres). Ex.: export JWT_SECRET="troque-por-uma-chave-longa-e-aleatoria-0000"
app.jwt.secret=${JWT_SECRET}

# Origens liberadas no CORS para o app (separadas por virgula)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

