spring.application.name=cuidar-de-perto-api
server.port=8080

# ---- Banco de dados (H2 em memoria para desenvolvimento e testes) ----
spring.datasource.url=jdbc:h2:mem:cuidardeperto;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---- Paginacao ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---- Segredos vindos de variaveis de ambiente (veja README) ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=7200
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081}

# ---- Cache (Caffeine, TTL curto para limitar defasagem) ----
app.cache.ttl-seconds=45

# ---- Monitoramento automatico (lembretes nao confirmados e escalonamento) ----
app.monitor.enabled=true
app.monitor.intervalo-ms=60000

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
